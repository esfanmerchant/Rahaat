[project]
name = "rahat-backend"
version = "0.1.0"
description = "Rahat prototype backend. Not an official service; all identity, payment and data services are simulated."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pgserver>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app"]
markers = ["db: needs a Postgres database (embedded dev server or TEST_DATABASE_URL_OWNER)"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# B008: FastAPI Depends() in defaults. S101: asserts. S105/S106: names that merely contain "password"/"secret".
# S311: non-cryptographic random is intended in the synthetic data generator.
# UP046: Pydantic generic models keep the Generic[T] form.
ignore = ["B008", "S101", "S105", "S106", "S311", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"**/tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
files = ["app/core", "app/contracts"]
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
follow_imports = "silent"
